name: Fetch ONPE

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ONPE data
        env:
          ONPE_COOKIES: ${{ secrets.ONPE_COOKIES }}
        run: python fetch.py

      - name: Commit datos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet || git commit -m "data: $(date -u +'%H:%M:%S UTC')"
          git push
